name: Build Windows Executable

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências Python
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

      - name: Instalar GLPK via Chocolatey
        shell: pwsh
        run: |
          choco install glpk -y
          New-Item -ItemType Directory -Force -Path solvers
          $glpsol = (Get-Command glpsol -ErrorAction SilentlyContinue).Source
          if (-not $glpsol) { $glpsol = "C:\ProgramData\chocolatey\bin\glpsol.exe" }
          Copy-Item $glpsol solvers\glpsol.exe
          $glpkDir = Split-Path $glpsol
          Get-ChildItem "$glpkDir\glpk*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination solvers\
          if ((Get-ChildItem "solvers\*.dll").Count -eq 0) {
            Get-ChildItem "$glpkDir\*.dll" | Copy-Item -Destination solvers\
          }
          Write-Host "Conteudo da pasta solvers:"
          Get-ChildItem solvers\

      - name: Build com PyInstaller
        run: |
          pyinstaller planejamento_ort.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlanejamentoORT-Windows
          path: dist\PlanejamentoORT.exe
          retention-days: 30

      - name: Criar Release no GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\PlanejamentoORT.exe