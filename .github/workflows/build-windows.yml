name: Build Windows Executable

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller flask pyomo pandas openpyxl

      - name: Baixar GLPK para Windows
        shell: pwsh
        run: |
          $url = "https://sourceforge.net/projects/winglpk/files/winglpk/GLPK-4.65/winglpk-4.65.zip/download"
          Invoke-WebRequest -Uri $url -OutFile winglpk.zip
          Expand-Archive -Path winglpk.zip -DestinationPath winglpk_extracted
          New-Item -ItemType Directory -Force -Path solvers
          Copy-Item winglpk_extracted\glpk-4.65\w64\glpsol.exe solvers\
          Copy-Item winglpk_extracted\glpk-4.65\w64\glpk_4_65.dll solvers\

      - name: Build com PyInstaller
        run: |
          pyinstaller planejamento_ort.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlanejamentoORT-Windows
          path: dist\PlanejamentoORT.exe
          retention-days: 30

      - name: Criar Release no GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\PlanejamentoORT.exe
